<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spytify has moved</title>
  <script>
    var old = location.pathname.match(/^\/spy-spotify(\/.*)$/);
    if (old) location.replace("https://spytify.github.io/spytify" + old[1] + location.search + location.hash);
  </script>
</head>
<body>
  <p>Spytify has moved to <a href="https://spytify.github.io/spytify/overview.html">spytify.github.io/spytify</a>.</p>
</body>
</html>
